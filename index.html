<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>在线练习系统</title>
    <style>
        :root { --bg:#f5f0eb; --card-bg:#fffef9; --text:#2c2416; --accent:#8b5e3c; --correct:#4a7c59; --wrong:#d4685c; --wrong-bg:#fef3f0; --border:#e0d5c7; --radius:14px; --font: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.6; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
        .app-container { max-width:1000px; margin:0 auto; padding:12px; }
        .header { background:var(--card-bg); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; box-shadow:0 2px 12px rgba(60,40,20,0.08); border:1px solid var(--border); display:flex; align-items:center; gap:12px; position:sticky; top:8px; z-index:100; }
        .logo { font-size:1.3em; font-weight:700; color:var(--accent); }
        .category-selector { display:flex; gap:8px; flex:1; overflow-x:auto; padding:4px 0; }
        .category-chip { padding:8px 16px; border-radius:20px; background:#f0ebe0; font-weight:600; font-size:0.9em; white-space:nowrap; border:1px solid transparent; cursor:pointer; }
        .category-chip.active { background:var(--accent); color:#fff; }
        .manage-btn,.sync-btn { padding:8px 12px; border-radius:20px; border:1px solid var(--border); background:#fff; font-weight:600; cursor:pointer; font-size:0.9em; }
        .sync-btn { background:#e8f5e9; color:var(--correct); border-color:var(--correct); }
        .nav-tabs { display:flex; gap:4px; background:var(--card-bg); border-radius:var(--radius); padding:5px; margin-bottom:12px; box-shadow:0 2px 12px rgba(60,40,20,0.08); border:1px solid var(--border); }
        .nav-tab { padding:12px 14px; border-radius:10px; cursor:pointer; font-weight:600; font-size:0.95em; border:none; background:transparent; color:#5c4f3a; flex:1; text-align:center; }
        .nav-tab.active { background:var(--accent); color:#fff; }
        .main-content { background:var(--card-bg); border-radius:var(--radius); padding:18px 16px; box-shadow:0 2px 12px rgba(60,40,20,0.08); border:1px solid var(--border); min-height:400px; }
        .question-card { border:1px solid var(--border); border-radius:12px; padding:18px 16px; margin-bottom:14px; background:#fffef9; }
        .q-header { display:flex; justify-content:space-between; margin-bottom:12px; }
        .q-number { font-weight:700; color:var(--accent); background:#f8f0e4; padding:4px 12px; border-radius:14px; }
        .options { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
        .option { padding:14px; border-radius:10px; border:2px solid var(--border); background:#fdfcf7; display:flex; align-items:center; gap:10px; cursor:pointer; }
        .option.selected { border-color:var(--accent); background:#fdf3e4; }
        .option.correct-answer { border-color:var(--correct)!important; background:#e0f2e0!important; }
        .option.wrong-answer { border-color:var(--wrong)!important; background:#ffe8e5!important; }
        .feedback { padding:10px 12px; border-radius:8px; font-weight:600; margin:10px 0; display:none; }
        .feedback.show { display:block; }
        .feedback.correct-fb { background:#e0f2e0; color:#2d5a3b; }
        .feedback.wrong-fb { background:#ffe8e5; color:#7b2d2d; }
        .action-row { display:flex; gap:8px; margin-top:8px; }
        .action-btn { padding:10px 14px; border-radius:20px; font-weight:600; font-size:0.9em; border:2px solid var(--border); background:#fff; cursor:pointer; }
        .btn-primary { background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:24px; font-weight:700; cursor:pointer; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 24px; border-radius:24px; z-index:999; opacity:0; transition:0.3s; }
        .toast.show { opacity:1; }
        textarea { width:100%; min-height:150px; border:1px solid var(--border); border-radius:10px; padding:14px; font-family:var(--font); }
        button { touch-action:manipulation; cursor:pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">练习系统</div>
        <div class="category-selector" id="categoryContainer"></div>
        <button class="manage-btn" id="manageBtn">⚙️ 类别</button>
        <button class="sync-btn" id="syncBtn">☁️ 同步</button>
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="practice">📖 练习</button>
        <button class="nav-tab" data-tab="wrongbook">📕 错题</button>
        <button class="nav-tab" data-tab="import">📥 导入</button>
        <button class="nav-tab" data-tab="export">📤 导出</button>
        <button class="nav-tab" data-tab="allQuestions">📋 全部</button>
    </div>
    <div class="main-content" id="mainContent"></div>
    <div class="toast" id="toast"></div>
</div>
<script>
(() => {
    const KEYS = {
        CATEGORIES: 'tcm_cats',
        QUESTIONS: 'tcm_ques',
        WRONG: 'tcm_wrong',
        SETTINGS: 'tcm_set',
        TOKEN: 'github_token',
        GIST_ID: 'tcm_gist_id',
        AUTO_SYNC: 'tcm_auto_sync'
    };

    let state = {
        categories: [],
        questions: [],
        wrongCounts: {},
        currentCategoryId: 'all',
        currentTab: 'practice',
        practiceMode: 'all',
        shuffledOrder: [],
        randomIndex: 0,
        tempSelection: {},
        autoSync: false
    };

    function loadAll() {
        try { state.categories = JSON.parse(localStorage.getItem(KEYS.CATEGORIES)) || []; } catch { state.categories = []; }
        if (!state.categories.length) state.categories = [{ id: 'default', name: '中医基础' }];
        try { state.questions = JSON.parse(localStorage.getItem(KEYS.QUESTIONS)) || []; } catch { state.questions = []; }
        try { state.wrongCounts = JSON.parse(localStorage.getItem(KEYS.WRONG)) || {}; } catch { state.wrongCounts = {}; }
        const s = JSON.parse(localStorage.getItem(KEYS.SETTINGS) || '{}');
        if (s.currentCategoryId) state.currentCategoryId = s.currentCategoryId;
        state.autoSync = localStorage.getItem(KEYS.AUTO_SYNC) === 'true';
    }

    function saveAll() {
        localStorage.setItem(KEYS.CATEGORIES, JSON.stringify(state.categories));
        localStorage.setItem(KEYS.QUESTIONS, JSON.stringify(state.questions));
        localStorage.setItem(KEYS.WRONG, JSON.stringify(state.wrongCounts));
        localStorage.setItem(KEYS.SETTINGS, JSON.stringify({ currentCategoryId: state.currentCategoryId }));
        localStorage.setItem(KEYS.AUTO_SYNC, state.autoSync);
    }

    function getToken() { return localStorage.getItem(KEYS.TOKEN) || ''; }
    function showToast(msg) {
        const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function renderCategories() {
        const c = document.getElementById('categoryContainer');
        c.innerHTML = '';
        ['all', ...state.categories.map(x => x.id)].forEach(id => {
            const chip = document.createElement('span');
            chip.className = 'category-chip' + (id === state.currentCategoryId ? ' active' : '');
            chip.textContent = id === 'all' ? '全部' : state.categories.find(x => x.id === id).name;
            chip.onclick = () => { state.currentCategoryId = id; localStorage.setItem(KEYS.SETTINGS, JSON.stringify({ currentCategoryId: id })); renderCategories(); initPractice(); renderContent(); };
            c.appendChild(chip);
        });
    }

    function initPractice() {
        const pool = state.practiceMode === 'wrong'
            ? state.questions.filter(q => state.currentCategoryId === 'all' || q.categoryId === state.currentCategoryId).filter(q => (state.wrongCounts[q.id] || 0) > 0)
            : state.questions.filter(q => state.currentCategoryId === 'all' || q.categoryId === state.currentCategoryId);
        state.shuffledOrder = shuffle(pool.map(q => q.id));
        state.randomIndex = 0;
    }

    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function getCurrentQuestion() {
        if (!state.shuffledOrder.length) initPractice();
        if (state.randomIndex >= state.shuffledOrder.length) return null;
        return state.questions.find(q => q.id === state.shuffledOrder[state.randomIndex]);
    }

    function renderPractice() {
        const q = getCurrentQuestion();
        if (!q) return '<div style="text-align:center;padding:30px;">🎉 本轮完成 <button class="btn-primary" onclick="window._restart()">重新开始</button></div>';
        const confirmed = q._confirmed;
        const sel = state.tempSelection[q.id] || '';
        const catName = state.categories.find(c => c.id === q.categoryId)?.name || '';

        let answerHTML = '';
        if (q.type === 'fill') {
            answerHTML = `<input type="text" id="fillAnswer" class="option" value="${sel}" placeholder="输入答案" ${confirmed ? 'disabled' : ''}>`;
            if (!confirmed) answerHTML += '<button class="btn-primary" id="confirmFill">确认</button>';
        } else {
            const labels = ['A','B','C','D','E'];
            answerHTML = q.opts.map((opt, i) => {
                const l = labels[i];
                let cls = 'option';
                if (sel.includes(l)) cls += ' selected';
                if (confirmed) {
                    if (q.ans.includes(l)) cls += ' correct-answer';
                    if (sel.includes(l) && !q.ans.includes(l)) cls += ' wrong-answer';
                }
                const attr = confirmed ? '' : `data-opt="${l}" data-qid="${q.id}"`;
                return `<div class="${cls}" ${attr}><span style="font-weight:700;color:var(--accent);">${l}</span> ${opt}</div>`;
            }).join('');
            if (q.type === 'multi' && !confirmed) answerHTML += '<button class="btn-primary" id="confirmMulti">确认答案</button>';
        }

        let feedback = '';
        if (confirmed) {
            const correct = q.type === 'fill' ? sel.trim() === q.ans.trim() : sel === q.ans;
            feedback = `<div class="feedback correct-fb show">${correct ? '✅ 正确' : '❌ 错误，答案：' + q.ans}</div>`;
        }

        const actions = confirmed ? `
            <div class="action-row">
                <button class="action-btn" onclick="copyAI(${q.id})">📋 复制AI</button>
                <button class="action-btn" onclick="correctAnswer(${q.id})">✏️ 纠错</button>
                <button class="action-btn" style="color:var(--wrong);border-color:var(--wrong);" onclick="deleteQuestion(${q.id})">🗑 删除</button>
            </div>` : '';

        return `
            <div class="question-card">
                <div class="q-header"><span class="q-number">${catName} #${q.id}</span><span>${q.type==='fill'?'填空': (q.type==='multi'?'多选':'单选')}</span></div>
                <div style="font-weight:600;margin-bottom:12px;">${q.q}</div>
                <div class="options">${answerHTML}</div>
                ${feedback}
                ${actions}
            </div>
            <div style="text-align:center;margin:8px;">${state.randomIndex+1}/${state.shuffledOrder.length}</div>
            <div style="display:flex;justify-content:center;gap:12px;">
                <button class="btn-primary" ${state.randomIndex===0?'disabled':''} onclick="prevQ()">◀ 上一题</button>
                <button class="btn-primary" onclick="nextQ()">下一题 ▶</button>
                <button class="btn-primary" onclick="jumpQ()">🔀 随机</button>
            </div>`;
    }

    function renderWrongBook() {
        const ids = Object.keys(state.wrongCounts).filter(id => state.wrongCounts[id] > 0).map(Number);
        if (!ids.length) return '<div style="text-align:center;padding:30px;">📕 暂无错题</div>';
        const qs = ids.map(id => state.questions.find(q => q.id === id)).filter(Boolean);
        return `<div><b>错题本 (${qs.length})</b> <button class="btn-primary" onclick="clearWrong()">清空当前</button></div>` +
            qs.map(q => `<div class="question-card"><span class="q-number">#${q.id} 错${state.wrongCounts[q.id]}次</span> <button onclick="removeWrong(${q.id})">✕</button><div>${q.q}</div><div style="color:var(--correct);font-weight:600;">答案：${q.ans}</div></div>`).join('');
    }

    function renderAllQuestions() {
        const pool = state.questions.filter(q => state.currentCategoryId === 'all' || q.categoryId === state.currentCategoryId);
        return `<div><b>全部题目 (${pool.length})</b></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">${pool.map(q => `<span class="btn-primary" onclick="jumpTo(${q.id})">#${q.id}</span>`).join('')}</div>`;
    }

    function renderImport() {
        return `<div><label>类别：</label><select id="importCat">${state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
        <textarea id="importText" placeholder="粘贴题目（文本/JSON）"></textarea>
        <button class="btn-primary" onclick="doImport()">解析导入</button><div id="importRes"></div></div>`;
    }

    function renderExport() {
        const token = getToken();
        return `<div>
            <h3>导出与同步</h3>
            <button class="btn-primary" onclick="exportData()">⬇️ 导出文件</button>
            <button class="btn-primary" onclick="downloadGist()" style="margin-left:10px;">☁️ 从云端下载</button>
            <div style="margin:16px 0;"><label><input type="checkbox" id="autoSyncCheck" ${state.autoSync?'checked':''}> 自动同步</label></div>
            <div style="margin-top:20px;">
                <h4>GitHub Token</h4>
                <input type="password" id="tokenInput" placeholder="ghp_..." value="${token}">
                <div style="font-size:0.9em;color:${token?'var(--correct)':'var(--wrong)'};">${token?'✅ 已保存':'⚠️ 未设置'}</div>
                <button class="btn-primary" onclick="saveToken()">保存 Token</button>
            </div>
        </div>`;
    }

    function renderContent() {
        const main = document.getElementById('mainContent');
        const map = {
            practice: renderPractice,
            wrongbook: renderWrongBook,
            allQuestions: renderAllQuestions,
            import: renderImport,
            export: renderExport
        };
        main.innerHTML = (map[state.currentTab] || renderPractice)();
    }

    // 交互处理
    document.getElementById('mainContent').addEventListener('click', e => {
        if (e.target.id === 'confirmFill') {
            const q = getCurrentQuestion();
            if (!q || q._confirmed) return;
            const val = document.getElementById('fillAnswer').value;
            state.tempSelection[q.id] = val;
            q._confirmed = true;
            if (val.trim() !== q.ans.trim()) state.wrongCounts[q.id] = (state.wrongCounts[q.id] || 0) + 1;
            saveAll(); maybeAutoSync(); renderContent();
        } else if (e.target.id === 'confirmMulti') {
            const q = getCurrentQuestion();
            if (!q || q._confirmed) return;
            q._confirmed = true;
            const sel = state.tempSelection[q.id] || '';
            if (sel !== q.ans) state.wrongCounts[q.id] = (state.wrongCounts[q.id] || 0) + 1;
            saveAll(); maybeAutoSync(); renderContent();
        } else if (e.target.dataset.opt) {
            const q = state.questions.find(q => q.id == e.target.dataset.qid);
            if (!q || q._confirmed) return;
            const letter = e.target.dataset.opt;
            if (q.type === 'single') {
                state.tempSelection[q.id] = letter;
                q._confirmed = true;
                if (letter !== q.ans) state.wrongCounts[q.id] = (state.wrongCounts[q.id] || 0) + 1;
                saveAll(); maybeAutoSync(); renderContent();
            } else {
                let arr = (state.tempSelection[q.id] || '').split('').filter(Boolean);
                if (arr.includes(letter)) arr = arr.filter(l => l !== letter);
                else arr.push(letter);
                state.tempSelection[q.id] = arr.sort().join('');
                e.target.classList.toggle('selected', arr.includes(letter));
            }
        }
    });

    // 导航
    window.nextQ = () => { if (state.randomIndex < state.shuffledOrder.length - 1) { const q = getCurrentQuestion(); if (q) delete q._confirmed; state.randomIndex++; } renderContent(); };
    window.prevQ = () => { if (state.randomIndex > 0) { const q = getCurrentQuestion(); if (q) delete q._confirmed; state.randomIndex--; } renderContent(); };
    window.jumpQ = () => { const q = getCurrentQuestion(); if (q) delete q._confirmed; state.randomIndex = Math.floor(Math.random() * state.shuffledOrder.length); renderContent(); };
    window._restart = () => { state.questions.forEach(q => delete q._confirmed); initPractice(); renderContent(); };

    // 云端同步核心
    async function uploadGist() {
        const token = getToken();
        if (!token) { showToast('请先设置Token'); return false; }
        const pureQuestions = state.questions.map(q => ({ id: q.id, q: q.q, opts: q.opts, ans: q.ans, type: q.type, categoryId: q.categoryId }));
        const confirmedMap = {};
        state.questions.forEach(q => { if (q._confirmed) confirmedMap[q.id] = true; });
        const payload = {
            categories: state.categories,
            questions: pureQuestions,
            wrongCounts: state.wrongCounts,
            confirmedStates: confirmedMap,
            userAnswers: state.tempSelection
        };
        const gistId = localStorage.getItem(KEYS.GIST_ID);
        const url = gistId ? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists';
        try {
            const res = await fetch(url, {
                method: gistId ? 'PATCH' : 'POST',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ description: '练习系统', public: false, files: { 'data.json': { content: JSON.stringify(payload) } } })
            });
            const json = await res.json();
            if (json.id) { localStorage.setItem(KEYS.GIST_ID, json.id); return true; }
            console.error(json); return false;
        } catch { return false; }
    }

    async function downloadGist() {
        const token = getToken();
        if (!token) { showToast('请先设置Token'); return; }
        const gistId = localStorage.getItem(KEYS.GIST_ID);
        if (!gistId) { showToast('请先在旧设备点击同步上传'); return; }
        showToast('下载中...');
        try {
            const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${token}` } });
            if (res.status === 401) { showToast('Token无效'); return; }
            if (res.status === 404) { showToast('未找到云端数据，请先上传'); return; }
            const json = await res.json();
            const file = json.files && json.files['data.json'];
            if (!file?.content) { showToast('数据格式错误'); return; }
            const data = JSON.parse(file.content);
            // 恢复数据
            state.categories = data.categories || [{ id: 'default', name: '中医基础' }];
            state.questions = (data.questions || []).map(q => ({ ...q, _confirmed: data.confirmedStates?.[q.id] || false }));
            state.wrongCounts = data.wrongCounts || {};
            state.tempSelection = data.userAnswers || {};
            saveAll();
            initPractice();
            renderCategories();
            renderContent();
            showToast('✅ 同步成功，题库和进度已恢复');
        } catch { showToast('网络错误'); }
    }

    function maybeAutoSync() { if (state.autoSync) uploadGist(); }

    // 导出/导入JSON（备选）
    window.exportData = () => {
        const blob = new Blob([JSON.stringify({ categories: state.categories, questions: state.questions, wrongCounts: state.wrongCounts, tempSelection: state.tempSelection })], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click();
    };

    window.doImport = () => {
        const text = document.getElementById('importText').value.trim();
        if (!text) return;
        let imported = [];
        try {
            imported = JSON.parse(text);
            if (!Array.isArray(imported)) imported = [];
        } catch {
            // 文本解析省略，可沿用之前逻辑
            const lines = text.split('\n');
            let cur = null, opts = [];
            for (const line of lines) {
                const t = line.trim();
                if (!t) continue;
                const qm = t.match(/^(\d+)[\.\、]\s*(.+)/);
                if (qm && !/^[A-E][\.\)]/.test(t)) { if (cur && opts.length >= 2) { cur.opts = opts; imported.push(cur); } cur = { q: qm[2], opts: [], ans: '', type: 'single' }; opts = []; continue; }
                const om = t.match(/^([A-E])[\.\)．]\s*(.+)/);
                if (om && cur) { opts.push(om[2]); continue; }
                const am = t.match(/^答案[：:]\s*(.+)/) || t.match(/^参考答案[：:]\s*(.+)/);
                if (am && cur) { cur.ans = am[1].replace(/\s/g, ''); cur.type = cur.ans.length > 1 ? 'multi' : 'single'; }
            }
            if (cur && opts.length >= 2) { cur.opts = opts; imported.push(cur); }
            else if (cur && cur.ans) { cur.type = 'fill'; imported.push(cur); }
        }
        if (!imported.length) return showToast('无法解析');
        const maxId = state.questions.reduce((m, q) => Math.max(m, q.id), 0);
        imported.forEach((q, i) => { q.id = maxId + i + 1; q.categoryId = document.getElementById('importCat').value; });
        state.questions.push(...imported);
        saveAll(); initPractice(); renderContent();
        showToast(`导入 ${imported.length} 题`);
    };

    window.saveToken = () => { const v = document.getElementById('tokenInput').value.trim(); if (v) { localStorage.setItem(KEYS.TOKEN, v); showToast('Token已保存'); renderContent(); } };
    document.getElementById('syncBtn').onclick = async () => { if (!getToken()) { showToast('请先设置Token'); return; } showToast('上传中...'); if (await uploadGist()) showToast('✅ 同步成功'); else showToast('❌ 失败'); };
    document.getElementById('manageBtn').onclick = () => {
        const name = prompt('新类别名称：');
        if (name) { state.categories.push({ id: Date.now().toString(), name }); saveAll(); renderCategories(); renderContent(); }
    };

    document.querySelectorAll('.nav-tab').forEach(t => t.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.currentTab = t.dataset.tab;
        if (state.currentTab === 'practice') initPractice();
        renderContent();
    });

    document.getElementById('mainContent').addEventListener('change', e => {
        if (e.target.id === 'autoSyncCheck') { state.autoSync = e.target.checked; saveAll(); }
    });

    // 初始加载
    loadAll();
    renderCategories();
    initPractice();
    renderContent();
})();
</script>
</body>
</html>
